[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-autopilot"
version = "0.1.0"
description = "Local-first LLM inference cost analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
inference-autopilot = "inference_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
